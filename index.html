<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入｜講座報到系統</title>
  <!-- 加入主畫面後以獨立 App 的樣子開啟（不會跳回瀏覽器） -->
  <link rel="manifest" href="manifest.json?v=20260807a">
  <meta name="theme-color" content="#14213D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="報到系統">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260807a">
  <link rel="stylesheet" href="css/styles.css?v=20260807a">
</head>
<body>
  <div class="login-wrap">
    <h1>講座報到系統</h1>
    <div class="card">
      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">密碼</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-full" id="loginBtn">登入</button>
      </form>
      <p class="muted" id="hint" style="margin-bottom:0">請用工作人員帳號登入。</p>
    </div>
  </div>

  <!-- 載入順序很重要：先函式庫 → 再設定 → 再共用工具 → 最後這一頁自己的程式 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=20260807a"></script>
  <script src="js/app.js?v=20260807a"></script>
  <script src="js/login.js?v=20260807a"></script>
</body>
</html>
