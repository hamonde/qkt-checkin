<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>統計｜講座報到系統</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="loading">
  <nav id="nav"></nav>

  <div class="wrap">
    <h1>累計參加統計</h1>

    <div class="card">
      <div class="field">
        <input type="text" id="search" placeholder="輸入姓名搜尋…">
      </div>
      <div class="row">
        <label style="flex:1 1 auto">
          排序方式
          <select id="sortBy">
            <option value="desc">參加次數：多 → 少</option>
            <option value="asc">參加次數：少 → 多</option>
            <option value="noshow">未到次數：多 → 少</option>
            <option value="name">依姓名</option>
          </select>
        </label>
      </div>
      <p class="muted" id="summary"></p>
    </div>

    <div class="card">
      <ul class="list" id="list"><li class="muted">載入中…</li></ul>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/stats.js"></script>
</body>
</html>
