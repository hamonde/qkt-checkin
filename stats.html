<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>統計｜講座報到系統</title>
  <!-- 加入主畫面後以獨立 App 的樣子開啟（不會跳回瀏覽器） -->
  <link rel="manifest" href="manifest.json?v=20261001a">
  <meta name="theme-color" content="#14213D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="報到系統">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261001a">
  <link rel="stylesheet" href="css/styles.css?v=20261001a">
</head>
<body class="loading">
  <nav id="nav"></nav>

  <div class="wrap">
    <h1>累計參加統計</h1>

    <div class="card">
      <div class="field">
        <input type="text" id="search" placeholder="輸入姓名搜尋…">
      </div>
      <div class="row">
        <label style="flex:1 1 auto">
          排序方式
          <select id="sortBy">
            <option value="desc">參加次數：多 → 少</option>
            <option value="asc">參加次數：少 → 多</option>
            <option value="noshow">未到次數：多 → 少</option>
            <option value="void">取消次數：多 → 少</option>
            <option value="name">依姓名</option>
          </select>
        </label>
      </div>
      <p class="muted" id="summary"></p>
    </div>

    <div class="card">
      <ul class="list" id="list"><li class="muted">載入中…</li></ul>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=20261001a"></script>
  <script src="js/app.js?v=20261001a"></script>
  <script src="js/stats.js?v=20261001a"></script>
</body>
</html>
