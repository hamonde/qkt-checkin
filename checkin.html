<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>報到｜講座報到系統</title>
  <!-- 加入主畫面後以獨立 App 的樣子開啟（不會跳回瀏覽器） -->
  <link rel="manifest" href="manifest.json?v=20261001d">
  <meta name="theme-color" content="#14213D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="報到系統">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261001d">
  <link rel="stylesheet" href="css/styles.css?v=20261001d">
</head>
<body class="loading">
  <nav id="nav"></nav>

  <div class="wrap">
    <h1>現場報到</h1>

    <div class="card">
      <label for="sessionSelect">選擇場次</label>
      <select id="sessionSelect"></select>
    </div>

    <div class="card" id="mainCard" hidden>
      <div class="row" style="align-items:center">
        <div style="flex:2 1 150px">
          <div class="muted">已報到 / 總數</div>
          <div class="stat-big"><span id="doneCount">0</span> / <span id="totalCount">0</span></div>
        </div>
        <div style="flex:1 1 80px">
          <div class="muted">未到</div>
          <div class="stat-big" id="noShowCount">0</div>
        </div>
        <div style="flex:1 1 80px">
          <div class="muted">作廢</div>
          <div class="stat-big muted" id="voidCount">0</div>
        </div>
      </div>
      <div class="spacer"></div>
      <input type="text" id="search" placeholder="輸入姓名或票號搜尋…">
      <div class="spacer"></div>
      <div class="row">
        <button id="modeBtn" class="secondary"></button>
        <button id="filterBtn" class="secondary"></button>
      </div>
      <div class="spacer"></div>
      <div class="row">
        <button id="allInBtn" class="secondary small">全部標記已報到</button>
        <button id="allOutBtn" class="secondary small">全部取消報到</button>
      </div>
    </div>

    <div class="card" id="listCard" hidden>
      <p class="muted">
        ✓ 完成報到　✗ 標記未到　再點一次可取消。點時間可以手動修改。<br>
        <span id="colorLegend"></span>
      </p>
      <ul class="list" id="list"></ul>
    </div>

    <div class="card" id="walkInCard" hidden>
      <details>
        <summary>現場登記（非報名者臨時入場）</summary>
        <div class="spacer"></div>
        <p class="muted">登記後會直接算已報到，並標上「現場」以便事後追蹤實際參與人數。</p>
        <form id="walkInForm">
          <div class="row">
            <div class="field">
              <label for="wName">姓名</label>
              <input type="text" id="wName" required>
            </div>
            <div class="field">
              <label for="wEntryType">入場時段</label>
              <select id="wEntryType">
                <option value="特殊">特殊入場</option>
                <option value="攜幼">攜幼入場</option>
                <option value="宣語">宣語入場</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="wNote">備註（原因、聯絡方式…）</label>
            <input type="text" id="wNote" placeholder="例：陪同長輩、臨時加入">
          </div>
          <button type="submit" class="btn-full">登記並完成報到</button>
        </form>
      </details>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=20261001d"></script>
  <script src="js/app.js?v=20261001d"></script>
  <script src="js/checkin.js?v=20261001d"></script>
</body>
</html>
