<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>場次｜講座報到系統</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="loading">
  <nav id="nav"></nav>

  <div class="wrap">
    <h1>場次管理</h1>

    <div class="card">
      <h2>新增場次</h2>
      <form id="sessionForm">
        <div class="row">
          <div class="field">
            <label for="code">場次代碼 code</label>
            <input type="text" id="code" placeholder="例：0801" required>
          </div>
          <div class="field">
            <label for="event_date">日期（可以填過去的日期）</label>
            <input type="date" id="event_date" required>
          </div>
        </div>
        <div class="field">
          <label for="title">講座名稱 title</label>
          <input type="text" id="title" placeholder="例：8月親子共讀講座" required>
        </div>
        <div class="field">
          <label for="total_seats">總席次</label>
          <input type="number" id="total_seats" min="0" value="30" required>
        </div>
        <button type="submit" class="btn-full" id="saveBtn">新增場次</button>
      </form>
      <p class="muted">票號會長這樣：<code id="ticketPreview">XYT-PRE-0801-01</code></p>
    </div>

    <div class="card">
      <h2>所有場次</h2>
      <div id="list" class="muted">載入中…</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sessions.js"></script>
</body>
</html>
