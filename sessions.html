<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>場次｜講座報到系統</title>
  <!-- 加入主畫面後以獨立 App 的樣子開啟（不會跳回瀏覽器） -->
  <link rel="manifest" href="manifest.json?v=20260919a">
  <meta name="theme-color" content="#14213D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="報到系統">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260919a">
  <link rel="stylesheet" href="css/styles.css?v=20260919a">
</head>
<body class="loading">
  <nav id="nav"></nav>

  <div class="wrap">
    <h1>場次管理</h1>

    <div class="card">
      <h2>新增場次</h2>
      <form id="sessionForm">
        <div class="row">
          <div class="field">
            <label for="code">場次代碼 code</label>
            <input type="text" id="code" placeholder="例：0801" required>
          </div>
          <div class="field">
            <label for="event_date">日期（可以填過去的日期）</label>
            <input type="date" id="event_date" required>
          </div>
        </div>
        <div class="field">
          <label for="title">講座名稱（還沒確定可以先留空，之後再補）</label>
          <input type="text" id="title" placeholder="未定名">
        </div>
        <button type="submit" class="btn-full" id="saveBtn">新增場次</button>
      </form>
      <p class="muted">票號會長這樣：<code id="ticketPreview">XYT-PRE-0801-01</code></p>
    </div>

    <div class="card">
      <h2>所有場次</h2>
      <div id="list" class="muted">載入中…</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=20260919a"></script>
  <script src="js/app.js?v=20260919a"></script>
  <script src="js/sessions.js?v=20260919a"></script>
</body>
</html>
